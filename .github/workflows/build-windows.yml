name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: pwsh
        run: |
          $python = Join-Path $env:PythonLocation "python.exe"
          & $python --version
          & $python -m pip install --upgrade pip
          & $python -m pip install . pyinstaller

      - name: Run tests
        shell: pwsh
        run: |
          $python = Join-Path $env:PythonLocation "python.exe"
          & $python -m unittest discover -s tests -q

      - name: Build application
        shell: pwsh
        run: |
          $python = Join-Path $env:PythonLocation "python.exe"
          ./scripts/build_windows.ps1 -PythonExecutable $python

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if ([string]::IsNullOrWhiteSpace($iscc)) {
            $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path $iscc)) { throw "Không tìm thấy Inno Setup sau khi cài." }
          & $iscc "$env:GITHUB_WORKSPACE\installer\PlantAutomation.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup không thể tạo bộ cài Windows." }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Plant-Automation-Windows
          path: |
            release/Plant-Automation-Windows.zip
            release/Plant-Automation-Windows-Setup.exe
          if-no-files-found: error
